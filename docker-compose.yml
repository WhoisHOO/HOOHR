services:
  db:
    image: postgres:16-alpine
    # No hardcoded container_name: compose namespaces containers per project, so
    # a second checkout (or a second copy of this stack) cannot collide with an
    # already-running one.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoohr_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-hoohr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hr} -d ${POSTGRES_DB:-hoohr}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hr}:${POSTGRES_PASSWORD:-hoohr_dev_password}@db:5432/${POSTGRES_DB:-hoohr}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # The entrypoint runs `prisma db seed` inside the container, where there
      # is no .env file for the seed to read, so the bootstrap credentials have
      # to arrive as real environment variables or the seed has nothing to use.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-hr@app.local}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    # Reports healthy only once the schema exists, not merely once the port is
    # listening. `start.bat` waits on this to decide when to open the browser,
    # so a check that passes too early would open a page that 500s.
    # `redirect: "manual"` matters: fetch follows redirects by default, so the
    # default would have turned an auth bounce to /login (a 200) into a false
    # "healthy" - the probe would pass while the schema was still missing.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health',{redirect:'manual'}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  pgdata:
  uploads: