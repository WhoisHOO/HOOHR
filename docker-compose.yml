services:
  db:
    image: postgres:16-alpine
    # No hardcoded container_name: compose namespaces containers per project, so
    # a second checkout (or a second copy of this stack) cannot collide with an
    # already-running one.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoohr_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-hoohr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hr} -d ${POSTGRES_DB:-hoohr}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hr}:${POSTGRES_PASSWORD:-hoohr_dev_password}@db:5432/${POSTGRES_DB:-hoohr}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # The entrypoint runs `prisma db seed` inside the container, where there
      # is no .env file for the seed to read, so the bootstrap credentials have
      # to arrive as real environment variables or the seed has nothing to use.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      # The one answer the installer collected. The seed turns it into the
      # company's currency, timezone and language, so it has to reach the seed.
      COMPANY_COUNTRY: ${COMPANY_COUNTRY:-KR}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-hr@app.local}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    # Reports healthy only once the schema exists, not merely once the port is
    # listening. `start.bat` waits on this to decide when to open the browser,
    # so a check that passes too early would open a page that 500s.
    # `redirect: "manual"` matters: fetch follows redirects by default, so the
    # default would have turned an auth bounce to /login (a 200) into a false
    # "healthy" - the probe would pass while the schema was still missing.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health',{redirect:'manual'}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Public access, opt-in via `start-tunnel.bat`. Behind the `tunnel` profile so
  # an ordinary `start.bat` never exposes the app to the internet.
  #
  # Two services rather than one with a conditional command, because the two
  # modes need different arguments and a readable compose file beats a computed
  # one. They share a container_name on purpose: only one can run at a time, and
  # a clash is a clearer error than two half-working tunnels.
  # ---------------------------------------------------------------------------
  tunnel-quick:
    image: cloudflare/cloudflared:2026.9.2
    profiles: ["tunnel"]
    container_name: hoohr_tunnel
    restart: unless-stopped
    # No account, no domain, no cost - but the hostname is random and changes
    # every time the tunnel restarts, so it is for showing the app to someone,
    # not for a link you put in an email.
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      app:
        condition: service_healthy

  tunnel-named:
    image: cloudflare/cloudflared:2026.9.2
    profiles: ["tunnel"]
    container_name: hoohr_tunnel
    restart: unless-stopped
    # Stable hostname. Needs a Cloudflare account, a domain on the free plan, a
    # tunnel created in the dashboard, and TUNNEL_TOKEN in .env.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  uploads:

